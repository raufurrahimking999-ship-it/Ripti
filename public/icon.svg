      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="60%" stop-color="#0a0e1c" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
